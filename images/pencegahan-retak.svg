<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Empat langkah mencegah dinding retak rambut" font-family="Inter,Arial,sans-serif"><rect width="1600" height="800" fill="#E9DCC3"/><text x="800" y="86" text-anchor="middle" font-size="44" font-weight="700" fill="#1F1008">4 Langkah Mencegah Retak Rambut</text><rect x="70" y="170" width="340" height="470" rx="26" fill="#fff" stroke="#E7DAC4" stroke-width="2"/><circle cx="240" cy="260" r="52" fill="#1F1008"/><text x="240" y="280" text-anchor="middle" font-size="56" font-weight="700" fill="#E6CA65">1</text><text x="240" y="400" text-anchor="middle" font-size="33" font-weight="700" fill="#1F1008">Pilih pasir bersih</text><text x="240" y="450" text-anchor="middle" font-size="25" fill="#6E5E55">Uji botol sebelum dipakai</text><path d="M415 405 h26" stroke="#B8860B" stroke-width="7" stroke-linecap="round"/><rect x="445" y="170" width="340" height="470" rx="26" fill="#fff" stroke="#E7DAC4" stroke-width="2"/><circle cx="615" cy="260" r="52" fill="#1F1008"/><text x="615" y="280" text-anchor="middle" font-size="56" font-weight="700" fill="#E6CA65">2</text><text x="615" y="400" text-anchor="middle" font-size="33" font-weight="700" fill="#1F1008">Basahi dinding</text><text x="615" y="450" text-anchor="middle" font-size="25" fill="#6E5E55">Sebelum diplester</text><path d="M790 405 h26" stroke="#B8860B" stroke-width="7" stroke-linecap="round"/><rect x="820" y="170" width="340" height="470" rx="26" fill="#fff" stroke="#E7DAC4" stroke-width="2"/><circle cx="990" cy="260" r="52" fill="#1F1008"/><text x="990" y="280" text-anchor="middle" font-size="56" font-weight="700" fill="#E6CA65">3</text><text x="990" y="400" text-anchor="middle" font-size="33" font-weight="700" fill="#1F1008">Plester bertahap</text><text x="990" y="450" text-anchor="middle" font-size="25" fill="#6E5E55">Jangan terlalu tebal sekaligus</text><path d="M1165 405 h26" stroke="#B8860B" stroke-width="7" stroke-linecap="round"/><rect x="1195" y="170" width="340" height="470" rx="26" fill="#fff" stroke="#E7DAC4" stroke-width="2"/><circle cx="1365" cy="260" r="52" fill="#1F1008"/><text x="1365" y="280" text-anchor="middle" font-size="56" font-weight="700" fill="#E6CA65">4</text><text x="1365" y="400" text-anchor="middle" font-size="33" font-weight="700" fill="#1F1008">Rawat adukan</text><text x="1365" y="450" text-anchor="middle" font-size="25" fill="#6E5E55">Basahi ringan saat cuaca panas</text><text x="800" y="725" text-anchor="middle" font-size="24" fill="#6E5E55">Retak lebar atau memanjang bisa menandakan masalah struktur, konsultasikan ke tenaga ahli.</text></svg>